<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGDI - Sistema de Gestão de Demandas</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="header">
      <h1>SGDI</h1>
      <nav class="menu">
        <a href="/">Início</a>
        <a href="/nova_demanda">Nova Demanda</a>
        <a href="/solicitantes">Solicitantes</a>
        <form action="/buscar" method="GET" class="search-form">
          <input type="text" name="q" placeholder="Buscar demanda..." />
          <button type="submit">Buscar</button>
        </form>
      </nav>
    </header>

    {% with messages = get_flashed_messages() %} {% if messages %} {% for
    message in messages %}
    <div class="alert">{{ message }}</div>
    {% endfor %} {% endif %} {% endwith %}

    <main class="container">{% block content %}{% endblock %}</main>

    <footer class="footer">
      <p>SGDI v1.0 - 2024</p>
    </footer>
  </body>
</html>
