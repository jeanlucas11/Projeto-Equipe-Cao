{% extends "base.html" %}

{% block content %}
<h2>Nova Demanda</h2>

<form method="POST" action="/nova_demanda" style="max-width: 600px;">
    <div class="form-group">
        <label>Título:</label>
        <input type="text" name="titulo" placeholder="Título descritivo da demanda" required>
    </div>
    
    <div class="form-group">
        <label>Descrição:</label>
        <textarea name="descricao" rows="6" placeholder="Descreva os detalhes da demanda..." required></textarea>
    </div>
    
    <div class="form-group">
        <label>Solicitante:</label>
        <input type="text" name="solicitante" placeholder="Nome do solicitante" required>
    </div>

    <div class="form-group">
        <label>Nível Prioridade:</label>
        <select name="prioridade" required>
            <option value="" disabled selected>Selecione uma prioridade</option>
            <option value="Alta">Alta</option>
            <option value="Média">Média</option>
            <option value="Baixa">Baixa</option>
        </select>
    </div>
    
    <div style="margin-top: 30px; display: flex; gap: 10px;">
        <button type="submit">Salvar Demanda</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

{% endblock %}
