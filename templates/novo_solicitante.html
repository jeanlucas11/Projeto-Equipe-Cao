{% extends "base.html" %} {% block content %}
<h2>Novo Solicitante</h2>

<form method="POST" action="/novo_solicitante" style="max-width: 600px">
  <div class="form-group">
    <label>Nome:</label>
    <input type="text" name="nome" placeholder="Nome do solicitante" required />
  </div>

  <div class="form-group">
    <label>Senha:</label>
    <input
      type="password"
      name="senha"
      placeholder="Senha do solicitante"
      required
      style="
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 15px;
        font-family: inherit;
        box-sizing: border-box;
        transition: border-color 0.2s;
        background-color: #fff;
      "
    />
  </div>

  <div style="margin-top: 30px; display: flex; gap: 10px">
    <button type="submit">Cadastrar Solicitante</button>
    <a href="/solicitantes" class="btn btn-secondary">Cancelar</a>
  </div>
</form>

{% endblock %}
